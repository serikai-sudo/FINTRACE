[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fintrace"
dynamic = ["version"]
description = "FINTRACE: reproducible RL environment for training financial-audit agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml",
    "networkx",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.setuptools.dynamic]
version = { attr = "fintrace.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# ANN  -> type hints mandatory        T20 -> no print()
# S    -> bandit (S307: no eval)      DTZ -> timezone-aware datetimes only
# TID  -> banned APIs (see below)
select = ["E", "F", "W", "I", "B", "UP", "ANN", "T20", "S", "DTZ", "TID", "RUF"]
# S311 flags random.Random(seed) — the exact seeded-RNG pattern CLAUDE.md mandates
# (non-crypto randomness is intended here). Global RNG use is caught by TID251 below.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T20"]  # CLI tools report to stdout; the no-print rule applies to src/ only

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Wall clock / unseeded identifiers — episode data must derive from the seed only.
"time.time".msg = "Non-deterministic. Episode data must derive from the seed only (CLAUDE.md)."
"time.time_ns".msg = "Non-deterministic. Episode data must derive from the seed only (CLAUDE.md)."
"datetime.datetime.now".msg = "Non-deterministic. Derive timestamps from the seeded RNG (CLAUDE.md)."
"datetime.datetime.utcnow".msg = "Non-deterministic and naive. Derive timestamps from the seed (CLAUDE.md)."
"datetime.datetime.today".msg = "Non-deterministic. Derive timestamps from the seeded RNG (CLAUDE.md)."
"datetime.date.today".msg = "Non-deterministic. Derive dates from the seeded RNG (CLAUDE.md)."
"uuid.uuid1".msg = "Non-deterministic. Derive IDs from random.Random(seed) (CLAUDE.md)."
"uuid.uuid4".msg = "Non-deterministic. Derive IDs from random.Random(seed) (CLAUDE.md)."
# Global / OS-entropy RNGs — the only randomness source is an explicit random.Random(seed).
"random.random".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.seed".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.getstate".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.setstate".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.getrandbits".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.randbytes".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.randint".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.randrange".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.choice".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.choices".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.shuffle".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.sample".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.uniform".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.triangular".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.gauss".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.normalvariate".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.lognormvariate".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.expovariate".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.betavariate".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.gammavariate".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.paretovariate".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.weibullvariate".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.vonmisesvariate".msg = "Global RNG is banned. Use an explicit random.Random(seed) (CLAUDE.md)."
"random.SystemRandom".msg = "OS entropy is unreproducible. Use random.Random(seed) (CLAUDE.md)."
"os.urandom".msg = "OS entropy is unreproducible. Use random.Random(seed) (CLAUDE.md)."
"secrets".msg = "OS entropy is unreproducible. Use random.Random(seed) (CLAUDE.md)."
"numpy.random".msg = "Second RNG source breaks repro. Use the single random.Random(seed) (CLAUDE.md)."
# Shipped-image constraints.
"torch".msg = "torch is allowed only in experiments/bc_proof/ and never ships in the image."

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
