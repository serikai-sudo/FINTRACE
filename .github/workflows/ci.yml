name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        run: python -m pip install -r requirements.txt -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Fast tests
        run: make test

  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fast-tests
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        run: python -m pip install -r requirements.txt -e ".[dev]"

      - name: Slow tests (seed sweeps)
        run: make test-slow
